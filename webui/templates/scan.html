<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>扫码工作台</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #edf2f7;
      --surface: #fff;
      --text: #172033;
      --muted: #667085;
      --line: #d9e2ec;
      --blue: #2563eb;
      --green: #16803c;
      --red: #c2413a;
      --amber: #a15c08;
      --soft-blue: #eef4ff;
      --soft-green: #eaf7ef;
      --soft-red: #fff0ef;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    header {
      background: #101827;
      color: #fff;
      border-bottom: 1px solid #27364b;
    }
    .header-inner {
      width: min(1280px, calc(100vw - 32px));
      min-height: 76px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 23px; letter-spacing: 0; }
    .identity { margin-top: 5px; color: #b8c7d9; font-size: 13px; }
    button, .link-button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:hover, .link-button:hover { background: #f7f9fc; }
    button:disabled { opacity: .55; cursor: wait; }
    .primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .primary:hover { background: #1d4ed8; }
    .good { color: #166534; border-color: #78ba93; background: var(--soft-green); }
    .danger { color: #b3261e; border-color: #efa8a2; background: var(--soft-red); }
    header button { border-color: #53657c; background: #17243a; color: #fff; }
    header select {
      min-height: 34px;
      border: 1px solid #53657c;
      border-radius: 6px;
      background: #17243a;
      color: #fff;
      padding: 0 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
    }
    main {
      width: min(1280px, calc(100vw - 32px));
      margin: 18px auto 32px;
      display: grid;
      gap: 16px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }
    .stat { padding: 14px 16px; border-right: 1px solid var(--line); }
    .stat:last-child { border-right: 0; }
    .stat span { display: block; color: var(--muted); font-size: 12px; }
    .stat strong { display: block; margin-top: 4px; font-size: 22px; }
    section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }
    .section-head {
      min-height: 52px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
    }
    .section-head h2 { font-size: 16px; }
    .muted { color: var(--muted); font-size: 12px; }
    .queue-head { flex-wrap: wrap; }
    .queue-tabs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .queue-tab { color: var(--muted); background: #fff; }
    .queue-tab.active {
      color: #1d4ed8;
      border-color: #9ab8ff;
      background: var(--soft-blue);
    }
    .tab-count {
      min-width: 22px;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 999px;
      background: #e8edf5;
      color: #475467;
      text-align: center;
      font-size: 11px;
    }
    .queue-tab.active .tab-count { color: #1d4ed8; background: #dbe7ff; }
    .queue-panel[hidden] { display: none; }
    .current-grid {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr));
      gap: 14px;
    }
    .task-card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      display: grid;
      grid-template-columns: 188px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    .qr {
      width: 188px;
      height: 188px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      object-fit: contain;
    }
    .qr-empty {
      width: 188px;
      height: 188px;
      display: grid;
      place-items: center;
      border: 1px dashed #aab6c5;
      border-radius: 6px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 12px;
    }
    .task-meta { min-width: 0; display: grid; gap: 9px; }
    .email { font-weight: 800; overflow-wrap: anywhere; }
    .meta-row { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .countdown { color: var(--amber); font-weight: 800; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      padding: 11px 14px;
      border-bottom: 1px solid #edf1f5;
      text-align: left;
      white-space: nowrap;
      vertical-align: middle;
    }
    th { color: #475467; background: #fbfcfe; font-size: 12px; }
    tbody tr:last-child td { border-bottom: 0; }
    .pill {
      display: inline-flex;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
    }
    .status-pending { color: #1d4ed8; background: var(--soft-blue); }
    .status-claimed { color: var(--amber); background: #fff5dd; }
    .status-scanned, .status-completed { color: var(--green); background: var(--soft-green); }
    .status-failed { color: var(--red); background: var(--soft-red); }
    .candidate-message { max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
    .empty { padding: 30px 16px; color: var(--muted); text-align: center; font-size: 13px; }
    .pagination {
      min-height: 48px;
      padding: 8px 14px;
      border-top: 1px solid var(--line);
      background: #fbfcfe;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .pagination .page-info {
      min-width: 112px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }
    .pagination:empty { display: none; }
    #toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(420px, calc(100vw - 36px));
      padding: 10px 14px;
      border-radius: 8px;
      background: #101827;
      color: #fff;
      box-shadow: 0 14px 30px rgba(15,23,42,.24);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: .18s ease;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 760px) {
      .header-inner { width: min(100% - 24px, 1280px); }
      main { width: min(100% - 20px, 1280px); margin-top: 10px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .stat:nth-child(2) { border-right: 0; }
      .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .task-card { grid-template-columns: 1fr; }
      .qr, .qr-empty { width: min(260px, 100%); height: auto; aspect-ratio: 1; justify-self: center; }
      .section-head { align-items: flex-start; }
      .queue-tabs { width: 100%; }
      .queue-tab { flex: 1 1 auto; }
      .pagination { justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1 data-i18n="title">扫码工作台</h1>
        <p class="identity">{{ scanner_name }}</p>
      </div>
      <div class="actions">
        <select id="localeSelect" aria-label="Language">
          <option value="zh">中文</option>
          <option value="hi">हिन्दी</option>
          <option value="en">English</option>
        </select>
        <form method="post" action="/logout"><button type="submit" data-i18n="logout">退出</button></form>
      </div>
    </div>
  </header>

  <main>
    <div class="stats">
      <div class="stat"><span data-i18n="pending">待领取</span><strong id="countPending">0</strong></div>
      <div class="stat"><span data-i18n="claimed">我已领取</span><strong id="countClaimed">0</strong></div>
      <div class="stat"><span data-i18n="checking">自动检测中</span><strong id="countScanned">0</strong></div>
      <div class="stat"><span data-i18n="completed">已开通</span><strong id="countCompleted">0</strong></div>
    </div>

    <section>
      <div class="section-head">
        <h2 data-i18n="myTasks">我已领取</h2>
        <span class="muted" id="refreshState" data-i18n="loading">加载中</span>
      </div>
      <div id="currentTasks"></div>
    </section>

    <section aria-label="任务队列">
      <div class="section-head queue-head">
        <div class="queue-tabs" role="tablist">
          <button class="queue-tab" type="button" role="tab" data-queue-tab="extract">
            <span data-i18n="extractAccounts">可提链账号</span>
            <span class="tab-count" id="extractTabCount">0</span>
          </button>
          <button class="queue-tab" type="button" role="tab" data-queue-tab="pending">
            <span data-i18n="pendingTasks">待领取</span>
            <span class="tab-count" id="pendingTabCount">0</span>
          </button>
          <button class="queue-tab" type="button" role="tab" data-queue-tab="history">
            <span data-i18n="history">我的记录</span>
            <span class="tab-count" id="historyTabCount">0</span>
          </button>
        </div>
        <span class="muted" id="queueState">0</span>
      </div>

      <div class="queue-panel" data-queue-panel="extract">
        <div class="table-wrap">
          <table>
            <thead><tr><th data-i18n="account">账号</th><th data-i18n="extractStatus">提链状态</th><th data-i18n="method">方式</th><th data-i18n="actions">操作</th></tr></thead>
            <tbody id="extractCandidateBody"></tbody>
          </table>
        </div>
        <div class="empty" id="extractCandidateEmpty" data-i18n="noExtractCandidates">暂无可提链账号</div>
        <div class="pagination" id="extractPagination"></div>
      </div>

      <div class="queue-panel" data-queue-panel="pending" hidden>
        <div class="table-wrap">
          <table>
            <thead><tr><th data-i18n="task">任务</th><th data-i18n="account">账号</th><th data-i18n="method">方式</th><th data-i18n="linkExpires">链接到期</th><th data-i18n="actions">操作</th></tr></thead>
            <tbody id="pendingBody"></tbody>
          </table>
        </div>
        <div class="empty" id="pendingEmpty" data-i18n="noPending">暂无待领取任务</div>
        <div class="pagination" id="pendingPagination"></div>
      </div>

      <div class="queue-panel" data-queue-panel="history" hidden>
        <div class="table-wrap">
          <table>
            <thead><tr><th data-i18n="task">任务</th><th data-i18n="account">账号</th><th data-i18n="status">状态</th><th data-i18n="detectedAt">检测时间</th><th data-i18n="completedAt">完成时间</th></tr></thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
        <div class="empty" id="historyEmpty" data-i18n="noHistory">暂无扫码记录</div>
        <div class="pagination" id="historyPagination"></div>
      </div>
    </section>
  </main>
  <div id="toast"></div>

  <script>
    const $ = (s) => document.querySelector(s);
    let loading = false;
    const PAGE_SIZE = 20;
    const queuePages = {extract: 1, pending: 1, history: 1};
    let activeQueueTab = null;
    let latestQueueData = null;
    const LOCALE_KEY = 'scanner-locale';
    const I18N = {
      zh: {
        title: '扫码工作台', logout: '退出', pending: '待领取', claimed: '我已领取',
        checking: '自动检测中', completed: '已开通', myTasks: '我已领取',
        pendingTasks: '待领取', task: '任务', account: '账号', method: '方式',
        linkExpires: '链接到期', actions: '操作', status: '状态', detectedAt: '检测时间',
        completedAt: '完成时间', history: '我的记录', noPending: '暂无待领取任务',
        noHistory: '暂无扫码记录', noCurrentTasks: '当前没有已领取任务', loading: '加载中', updatedAt: '更新于',
        updateFailed: '更新失败', autoDetecting: '自动检测中', noQr: '当前任务没有二维码图片',
        openLinkHint: '请打开支付链接', taskNumber: '任务 #', lease: '领取租约',
        linkExpiry: '链接到期', openPayment: '打开支付链接', release: '释放',
        claim: '领取', claimedTask: '已领取任务 #{id}', released: '任务已释放',
        qrAlt: '任务 {id} 支付二维码', expired: '已过期', superseded: '已替换',
        extractAccounts: '可提链账号', extractStatus: '提链状态', noExtractCandidates: '暂无可提链账号',
        candidateCount: '共 {count} 个', extractReady: '可提链', extracting: '提链中', extractFailed: '提链失败',
        linkExpired: '链接已过期', extractAndClaim: '提链并领取', retryExtract: '重试提链',
        confirmExtract: '确定提链并领取该账号吗？成功提链会消耗 1 次 CDK。', extractQueued: '提链任务已提交',
        activeSummary: '当前 {active}/{limit}', limitReached: '已达上限',
        previousPage: '上一页', nextPage: '下一页', pageSummary: '第 {page}/{pages} 页 · 共 {count} 条',
      },
      hi: {
        title: 'स्कैन कार्यक्षेत्र', logout: 'लॉग आउट', pending: 'लंबित',
        claimed: 'मेरे लिए लिया गया', checking: 'स्वचालित जाँच जारी',
        completed: 'सक्रिय', myTasks: 'मेरे कार्य', pendingTasks: 'लंबित कार्य',
        task: 'कार्य', account: 'खाता', method: 'विधि', linkExpires: 'लिंक समाप्ति',
        actions: 'कार्रवाई', status: 'स्थिति', detectedAt: 'जाँच समय',
        completedAt: 'पूर्ण समय', history: 'मेरी गतिविधि', noPending: 'कोई लंबित कार्य नहीं',
        noHistory: 'कोई रिकॉर्ड नहीं', noCurrentTasks: 'कोई सक्रिय कार्य नहीं', loading: 'लोड हो रहा है', updatedAt: 'अपडेट',
        updateFailed: 'अपडेट विफल', autoDetecting: 'स्वचालित जाँच जारी',
        noQr: 'इस कार्य में QR कोड चित्र नहीं है', openLinkHint: 'भुगतान लिंक खोलें',
        taskNumber: 'कार्य #', lease: 'लिया गया समय', linkExpiry: 'लिंक समाप्ति',
        openPayment: 'भुगतान लिंक खोलें', release: 'रिलीज़', claim: 'लें',
        claimedTask: 'कार्य #{id} लिया गया', released: 'कार्य रिलीज़ किया गया',
        qrAlt: 'कार्य {id} का भुगतान QR कोड', expired: 'समाप्त', superseded: 'बदला गया',
        extractAccounts: 'लिंक बनाने योग्य खाते', extractStatus: 'लिंक स्थिति', noExtractCandidates: 'कोई खाता उपलब्ध नहीं',
        candidateCount: 'कुल {count}', extractReady: 'तैयार', extracting: 'लिंक बन रहा है', extractFailed: 'लिंक विफल',
        linkExpired: 'लिंक समाप्त', extractAndClaim: 'लिंक बनाएँ और लें', retryExtract: 'फिर से प्रयास करें',
        confirmExtract: 'इस खाते का लिंक बनाकर कार्य लेना है? सफल लिंक पर 1 CDK उपयोग होगा।', extractQueued: 'लिंक कार्य जमा हुआ',
        activeSummary: 'वर्तमान {active}/{limit}', limitReached: 'सीमा पूरी',
        previousPage: 'पिछला', nextPage: 'अगला', pageSummary: 'पृष्ठ {page}/{pages} · कुल {count}',
      },
      en: {
        title: 'Scan Workbench', logout: 'Log out', pending: 'Pending',
        claimed: 'Claimed by me', checking: 'Auto-checking', completed: 'Activated',
        myTasks: 'My tasks', pendingTasks: 'Pending tasks', task: 'Task',
        account: 'Account', method: 'Method', linkExpires: 'Link expires',
        actions: 'Actions', status: 'Status', detectedAt: 'Detected at',
        completedAt: 'Completed at', history: 'My history', noPending: 'No pending tasks',
        noHistory: 'No scan records', noCurrentTasks: 'No active tasks', loading: 'Loading', updatedAt: 'Updated at',
        updateFailed: 'Update failed', autoDetecting: 'Auto-checking',
        noQr: 'This task has no QR image', openLinkHint: 'Open the payment link',
        taskNumber: 'Task #', lease: 'Claim lease', linkExpiry: 'Link expires',
        openPayment: 'Open payment link', release: 'Release', claim: 'Claim',
        claimedTask: 'Task #{id} claimed', released: 'Task released',
        qrAlt: 'Payment QR code for task {id}', expired: 'Expired', superseded: 'Replaced',
        extractAccounts: 'Accounts ready for links', extractStatus: 'Link status', noExtractCandidates: 'No accounts ready for links',
        candidateCount: '{count} accounts', extractReady: 'Ready', extracting: 'Creating link', extractFailed: 'Link failed',
        linkExpired: 'Link expired', extractAndClaim: 'Create and claim', retryExtract: 'Retry link',
        confirmExtract: 'Create the payment link and claim this account? A successful link uses 1 CDK.', extractQueued: 'Link task submitted',
        activeSummary: 'Active {active}/{limit}', limitReached: 'Limit reached',
        previousPage: 'Previous', nextPage: 'Next', pageSummary: 'Page {page}/{pages} · {count} total',
      },
    };
    const savedLocale = localStorage.getItem(LOCALE_KEY);
    let locale = savedLocale || (
      (navigator.language || '').toLowerCase().startsWith('hi') ? 'hi' : 'zh'
    );
    if (!I18N[locale]) locale = 'zh';
    function t(key, vars = {}) {
      let value = I18N[locale][key] || I18N.zh[key] || key;
      return value.replace(/\{(\w+)\}/g, (_, name) => String(vars[name] ?? ''));
    }
    function localeTag() {
      return locale === 'hi' ? 'hi-IN' : locale === 'en' ? 'en-US' : 'zh-CN';
    }
    function applyLocale() {
      document.documentElement.lang = locale === 'hi' ? 'hi' : locale;
      document.title = t('title');
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });
      $('#localeSelect').value = locale;
    }
    $('#localeSelect').addEventListener('change', () => {
      locale = $('#localeSelect').value;
      localStorage.setItem(LOCALE_KEY, locale);
      applyLocale();
      loadQueue(true);
    });
    applyLocale();

    function esc(v) {
      return String(v == null || v === '' ? '-' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmtDate(v) {
      if (!v) return '-';
      const numeric = Number(v);
      const d = Number.isFinite(numeric) && numeric > 0
        ? new Date(numeric > 1e12 ? numeric : numeric * 1000)
        : new Date(v);
      return Number.isNaN(d.getTime()) ? String(v) : d.toLocaleString(localeTag());
    }
    function statusLabel(status) {
      return {
        pending: t('pending'), claimed: t('claimed'), scanned: t('checking'),
        completed: t('completed'), expired: t('expired'), superseded: t('superseded'),
      }[status] || status || '-';
    }
    function showToast(text) {
      const toast = $('#toast');
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }
    async function api(url, options) {
      const response = await fetch(url, options);
      if (response.status === 401) {
        location.href = '/login?next=/scan';
        throw new Error('登录已失效');
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }
    function remaining(ts) {
      const seconds = Math.max(0, Math.floor(Number(ts || 0) - Date.now() / 1000));
      const minute = Math.floor(seconds / 60);
      const second = seconds % 60;
      return `${minute}:${String(second).padStart(2, '0')}`;
    }
    function pageItems(items, key) {
      const total = items.length;
      const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      queuePages[key] = Math.max(1, Math.min(queuePages[key] || 1, pages));
      const page = queuePages[key];
      return {
        items: items.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE),
        page,
        pages,
        total,
      };
    }
    function renderPagination(id, key, result) {
      const container = $(`#${id}`);
      if (!result.total) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = `
        <button type="button" ${result.page <= 1 ? 'disabled' : ''} onclick="changePage('${key}', -1)">${esc(t('previousPage'))}</button>
        <span class="page-info">${esc(t('pageSummary', {page: result.page, pages: result.pages, count: result.total}))}</span>
        <button type="button" ${result.page >= result.pages ? 'disabled' : ''} onclick="changePage('${key}', 1)">${esc(t('nextPage'))}</button>
      `;
    }
    function selectQueueTab(key) {
      if (!['extract', 'pending', 'history'].includes(key)) return;
      activeQueueTab = key;
      document.querySelectorAll('[data-queue-tab]').forEach((button) => {
        const selected = button.dataset.queueTab === key;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-selected', selected ? 'true' : 'false');
      });
      document.querySelectorAll('[data-queue-panel]').forEach((panel) => {
        panel.hidden = panel.dataset.queuePanel !== key;
      });
    }
    function changePage(key, delta) {
      queuePages[key] = Math.max(1, (queuePages[key] || 1) + delta);
      if (latestQueueData) render(latestQueueData);
    }
    document.querySelectorAll('[data-queue-tab]').forEach((button) => {
      button.addEventListener('click', () => selectQueueTab(button.dataset.queueTab));
    });
    function render(data) {
      latestQueueData = data;
      const counts = data.counts || {};
      const active = Number(counts.active || 0);
      const activeLimit = Number(counts.active_limit || 3);
      const atLimit = active >= activeLimit;
      $('#countPending').textContent = counts.pending || 0;
      $('#countClaimed').textContent = `${active} / ${activeLimit}`;
      $('#countScanned').textContent = (counts.claimed || 0) + (counts.scanned || 0);
      $('#countCompleted').textContent = counts.completed || 0;

      const candidates = data.extract_candidates || [];
      const pending = data.pending || [];
      const history = (data.mine || []).filter((task) => ['scanned', 'completed'].includes(task.status));
      if (!activeQueueTab) selectQueueTab(pending.length ? 'pending' : 'extract');
      $('#extractTabCount').textContent = candidates.length;
      $('#pendingTabCount').textContent = pending.length;
      $('#historyTabCount').textContent = history.length;
      $('#queueState').textContent = t('activeSummary', {active, limit: activeLimit});

      const candidatePage = pageItems(candidates, 'extract');
      $('#extractCandidateBody').innerHTML = candidatePage.items.map((candidate) => {
        const status = candidate.extract_link_status || 'ready';
        const inProgress = ['queued', 'running'].includes(status);
        const failed = status === 'failed';
        const expired = status === 'success';
        const limitReached = Boolean(candidate.limit_reached);
        const statusText = inProgress ? t('extracting') : failed ? t('extractFailed') : expired ? t('linkExpired') : t('extractReady');
        const statusClass = failed ? 'status-failed' : inProgress ? 'status-claimed' : 'status-pending';
        const buttonText = failed || expired ? t('retryExtract') : t('extractAndClaim');
        const message = candidate.extract_link_message || '';
        return `<tr>
          <td><strong>${esc(candidate.email)}</strong>${message ? `<div class="muted candidate-message" title="${esc(message)}">${esc(message)}</div>` : ''}</td>
          <td><span class="pill ${statusClass}">${esc(statusText)}</span></td>
          <td>${esc((candidate.extract_link_type || 'UPI').toUpperCase())}</td>
          <td><button class="good" ${candidate.can_extract ? '' : 'disabled'} onclick="extractAccount(${Number(candidate.account_id)}, this)">${esc(inProgress ? t('extracting') : limitReached ? t('limitReached') : buttonText)}</button></td>
        </tr>`;
      }).join('');
      $('#extractCandidateEmpty').style.display = candidates.length ? 'none' : 'block';
      renderPagination('extractPagination', 'extract', candidatePage);

      const claimed = (data.mine || []).filter((task) => task.status === 'claimed');
      $('#currentTasks').innerHTML = claimed.length ? `<div class="current-grid">${claimed.map((task) => `
        <article class="task-card">
          ${task.qr_url
            ? `<img class="qr" src="${esc(task.qr_url)}" alt="${esc(t('qrAlt', {id: task.id}))}" referrerpolicy="no-referrer">`
            : `<div class="qr-empty">${esc(t('noQr'))}<br>${esc(t('openLinkHint'))}</div>`}
          <div class="task-meta">
            <div><span class="pill status-claimed">${esc(t('autoDetecting'))} · ${esc(t('taskNumber'))}${esc(task.id)}</span></div>
            <div class="email">${esc(task.email)}</div>
            <div class="meta-row">${esc(t('method'))}：${esc(task.payment_method || task.link_type || '-')}</div>
            <div class="meta-row">${esc(t('lease'))}：<span class="countdown" data-countdown="${esc(task.lease_expires_at)}">${remaining(task.lease_expires_at)}</span></div>
            <div class="meta-row">${esc(t('linkExpiry'))}：${esc(fmtDate(task.link_expires_at))}</div>
            <div class="actions">
              ${task.payment_url ? `<a class="link-button" href="${esc(task.payment_url)}" target="_blank" rel="noopener noreferrer">${esc(t('openPayment'))}</a>` : ''}
              <button class="danger" onclick="taskAction(${Number(task.id)}, 'release', this)">${esc(t('release'))}</button>
            </div>
          </div>
        </article>`).join('')}</div>` : `<div class="empty">${esc(t('noCurrentTasks'))}</div>`;

      const pendingPage = pageItems(pending, 'pending');
      $('#pendingBody').innerHTML = pendingPage.items.map((task) => `
        <tr>
          <td>#${esc(task.id)}</td>
          <td>${esc(task.email)}</td>
          <td>${esc(task.payment_method || task.link_type || '-')}</td>
          <td>${esc(fmtDate(task.link_expires_at))}</td>
          <td><button class="primary" ${atLimit ? 'disabled' : ''} onclick="claimTask(${Number(task.id)}, this)">${esc(atLimit ? t('limitReached') : t('claim'))}</button></td>
        </tr>`).join('');
      $('#pendingEmpty').style.display = pending.length ? 'none' : 'block';
      renderPagination('pendingPagination', 'pending', pendingPage);

      const historyPage = pageItems(history, 'history');
      $('#historyBody').innerHTML = historyPage.items.map((task) => `
        <tr>
          <td>#${esc(task.id)}</td>
          <td>${esc(task.email)}</td>
          <td><span class="pill status-${esc(task.status)}">${esc(statusLabel(task.status))}</span></td>
          <td>${esc(fmtDate(task.scanned_at))}</td>
          <td>${esc(fmtDate(task.completed_at))}</td>
        </tr>`).join('');
      $('#historyEmpty').style.display = history.length ? 'none' : 'block';
      renderPagination('historyPagination', 'history', historyPage);
      selectQueueTab(activeQueueTab);
    }
    async function loadQueue(silent = false) {
      if (loading) return;
      loading = true;
      try {
        const data = await api('/api/scan/queue');
        render(data);
        $('#refreshState').textContent = `${t('updatedAt')} ${new Date().toLocaleTimeString(localeTag())}`;
      } catch (error) {
        $('#refreshState').textContent = t('updateFailed');
        if (!silent) showToast(error.message);
      } finally {
        loading = false;
      }
    }
    async function claimTask(id, button) {
      button.disabled = true;
      try {
        await api(`/api/scan/tasks/${id}/claim`, {method:'POST'});
        showToast(t('claimedTask', {id}));
        await loadQueue();
      } catch (error) {
        showToast(error.message);
        await loadQueue(true);
      } finally {
        button.disabled = false;
      }
    }
    async function extractAccount(accountId, button) {
      if (!confirm(t('confirmExtract'))) return;
      button.disabled = true;
      try {
        await api(`/api/scan/accounts/${accountId}/extract`, {method:'POST'});
        showToast(t('extractQueued'));
        await loadQueue(true);
      } catch (error) {
        showToast(error.message);
        await loadQueue(true);
      } finally {
        button.disabled = false;
      }
    }
    async function taskAction(id, action, button) {
      button.disabled = true;
      try {
        await api(`/api/scan/tasks/${id}/action`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({action}),
        });
        showToast(t('released'));
        await loadQueue();
      } catch (error) {
        showToast(error.message);
      } finally {
        button.disabled = false;
      }
    }
    setInterval(() => {
      document.querySelectorAll('[data-countdown]').forEach((el) => {
        el.textContent = remaining(el.dataset.countdown);
      });
    }, 1000);
    loadQueue();
    setInterval(() => loadQueue(true), 5000);
  </script>
</body>
</html>
